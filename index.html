<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PVC Card Maker — Auto Detect & A4 Layout</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<style>
:root{--bg:#f3f6fa;--panel:#fff;--line:#e2e8f0;--text:#172033;--muted:#64748b;--brand:#2563eb;--ok:#16a34a;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
.app{display:grid;grid-template-columns:360px 1fr;height:100vh;overflow:hidden}.side{background:#fff;border-right:1px solid var(--line);padding:18px;overflow:auto}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;color:var(--muted);margin:4px 0 18px}.card{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px;background:#fff}.card h3{font-size:13px;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-top:9px}label{font-size:10px;font-weight:800;text-transform:uppercase;color:#64748b;display:block;margin-bottom:4px}.input,select{width:100%;height:35px;border:1px solid #cbd5e1;border-radius:9px;padding:0 9px;background:#fff}.drop{border:1.5px dashed #94a3b8;border-radius:11px;padding:15px;text-align:center;color:#64748b;font-size:12px;cursor:pointer}.drop.drag{border-color:var(--brand);background:#eff6ff}.btn{border:0;border-radius:10px;height:39px;width:100%;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#eef2f7;color:#172033}.success{background:#16a34a;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.status{font-size:11px;font-weight:700;margin-top:8px}.ok{color:var(--ok)}.bad{color:var(--danger)}.muted{color:var(--muted)}
.slot-title{display:flex;align-items:center;justify-content:space-between}.badge{font-size:9px;padding:3px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:800}.check{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.mini{font-size:11px;color:#475569}.range{width:100%}.stage{position:relative;overflow:auto;background:#d9e2ec;padding:24px;display:flex;align-items:flex-start;justify-content:center}.paper{position:relative;background:#fff;box-shadow:0 12px 35px rgba(15,23,42,.16);margin:auto}.paper canvas{display:block;width:min(100%,900px);height:auto}.toolbar{position:fixed;right:22px;top:18px;display:flex;gap:8px;z-index:5}.toolbar button{border:1px solid #cbd5e1;border-radius:9px;background:#fff;height:34px;padding:0 11px;font-weight:700;cursor:pointer}.guide{position:absolute;inset:0;pointer-events:none}.hidden{display:none!important}.progress{height:5px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:7px}.bar{height:100%;width:0;background:var(--brand);transition:.15s}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:52vh}.stage{height:48vh}.toolbar{position:absolute;top:8px;right:8px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">PVC Card Maker</div><div class="sub">Auto-detect • CR80 • A4 print layout</div>
  <div class="card"><div class="drop" id="drop">Drop PDF here<br><b>or click to choose PDF</b><input id="file" type="file" accept="application/pdf" hidden></div><div class="progress"><div class="bar" id="bar"></div></div><div id="globalStatus" class="status muted">Ready</div></div>
  <div id="slots"></div>
  <div class="card">
    <h3>Print setup</h3>
    <div class="row"><div class="field"><label>Cards per sheet</label><select id="count"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option></select></div><div class="field"><label>Gap (mm)</label><input class="input" id="gap" type="number" min="0" max="20" value="3"></div></div>
    <div class="check"><label style="text-transform:none;font-size:11px"><input id="mirror" type="checkbox"> Mirror for duplex</label><label style="text-transform:none;font-size:11px"><input id="outline" type="checkbox" checked> Cut guides</label></div>
  </div>
  <button class="btn primary" id="download">Download print-ready A4 JPG</button>
</aside>
<main class="stage"><div class="toolbar"><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="fit">Fit</button></div><div class="paper"><canvas id="a4" width="2480" height="3508"></canvas></div></main>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
const A4W=2480,A4H=3508,DPI=300,CARDW=Math.round(85.6/25.4*DPI),CARDH=Math.round(54/25.4*DPI); // 1011 x 638
const slots={}; let fitScale=1; let zoom=1;
const $=id=>document.getElementById(id); const ctx=$('a4').getContext('2d');
function addSlots(){let html='';for(let i=1;i<=5;i++){slots[i]={pdf:null,render:null,front:null,back:null,auto:true,detected:false};html+=`<div class="card"><div class="slot-title"><h3>Card ${i}</h3><span class="badge" id="badge-${i}">EMPTY</span></div><div class="row"><div class="field"><label>Document</label><select id="type-${i}"><option value="auto">Auto detect</option><option value="aadhaar">e-Aadhaar</option><option value="pan">e-PAN</option><option value="ayushman">Ayushman</option></select></div><div class="field"><label>Password</label><input class="input" id="pass-${i}" type="password"></div></div><div class="field"><label>Crop correction</label><input class="range" id="adjust-${i}" type="range" min="-12" max="12" step="0.1" value="0" disabled></div><div class="status muted" id="status-${i}">Waiting for PDF</div></div>`} $('slots').innerHTML=html;}
addSlots();
function setStatus(i,t,cls='muted'){const e=$('status-'+i);e.textContent=t;e.className='status '+cls}
function kindFromText(text){text=(text||'').toLowerCase();if(text.includes('income tax department')||text.includes('permanent account number')||text.includes('pan'))return'pan';if(text.includes('aadhaar')||text.includes('unique identification')||text.includes('uidai'))return'aadhaar';if(text.includes('ayushman')||text.includes('pm-jay')||text.includes('health account'))return'ayushman';return'auto'}
function scoreRect(w,h,area,total){const r=Math.max(w,h)/Math.min(w,h), target=85.6/54; const ratio=Math.exp(-Math.abs(Math.log(r/target))*5); const a=Math.min(1,area/(total*.04)); return ratio*.75+a*.25}
function detectCards(src){
  if(typeof cv==='undefined'||!cv.Mat) return [];
  let small=new cv.Mat(); let gray=new cv.Mat(); let bw=new cv.Mat(); cv.resize(src,small,new cv.Size(0,0),.55,.55,cv.INTER_AREA); cv.cvtColor(small,gray,cv.COLOR_RGBA2GRAY); cv.GaussianBlur(gray,gray,new cv.Size(5,5),0); cv.Canny(gray,bw,60,160);
  let contours=new cv.MatVector(),hier=new cv.Mat(); cv.findContours(bw,contours,hier,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
  const out=[]; const total=small.cols*small.rows;
  for(let i=0;i<contours.size();i++){let c=contours.get(i), peri=cv.arcLength(c,true), approx=new cv.Mat(); cv.approxPolyDP(c,approx,.025*peri,true); let rect=cv.boundingRect(approx); if(approx.rows>=4 && rect.width>220 && rect.height>130){let s=scoreRect(rect.width,rect.height,rect.width*rect.height,total); if(s>.42)out.push({x:Math.round(rect.x/.55),y:Math.round(rect.y/.55),w:Math.round(rect.width/.55),h:Math.round(rect.height/.55),score:s});} c.delete();approx.delete();}
  small.delete();gray.delete();bw.delete();contours.delete();hier.delete();
  out.sort((a,b)=>b.score-a.score); const keep=[]; for(const r of out){if(!keep.some(k=>Math.abs(k.x-r.x)<r.w*.18&&Math.abs(k.y-r.y)<r.h*.18))keep.push(r)} return keep.slice(0,2);
}
function cropFromRect(img,r){const c=document.createElement('canvas');c.width=CARDW;c.height=CARDH;const g=c.getContext('2d');g.imageSmoothingQuality='high'; if(r){const pad=.015;const x=Math.max(0,r.x-r.w*pad),y=Math.max(0,r.y-r.h*pad),w=Math.min(img.width-x,r.w*(1+2*pad)),h=Math.min(img.height-y,r.h*(1+2*pad));g.drawImage(img,x,y,w,h,0,0,CARDW,CARDH)} return c;}
function fallback(img,kind){ // Safe generic fallback; exact formats can still be corrected with the slider.
  const w=img.width,h=img.height; const map={aadhaar:[.05,.67,.47,.21,.52,.67],pan:[.05,.70,.47,.21,.55,.70],ayushman:[.045,.12,.47,.21,.51,.12]}; const p=map[kind]||map.aadhaar; const f={x:p[0]*w,y:p[1]*h,w:p[2]*w,h:p[3]*h},b={x:p[4]*w,y:p[5]*h,w:p[2]*w,h:p[3]*h}; return [cropFromRect(img,f),cropFromRect(img,b)];
}
async function process(file,i){
  $('bar').style.width='15%'; setStatus(i,'Reading PDF…');$('badge-'+i).textContent='PROCESSING';
  try{const data=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data,password:$('pass-'+i).value}).promise; const page=await pdf.getPage(1); const v=page.getViewport({scale:3.5}); const c=document.createElement('canvas');c.width=v.width;c.height=v.height;await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    let text='';try{const tc=await page.getTextContent();text=tc.items.map(x=>x.str).join(' ')}catch(e){} const selected=$('type-'+i).value==='auto'?kindFromText(text):$('type-'+i).value; if($('type-'+i).value==='auto')$('type-'+i).value=selected;
    $('bar').style.width='50%'; let cvReady=!!(window.cv&&cv.Mat); if(!cvReady) await new Promise(resolve=>{let t=setInterval(()=>{if(window.cv&&cv.Mat){clearInterval(t);resolve()}},100);setTimeout(()=>{clearInterval(t);resolve()},4000)}); const rects=detectCards(c); let front,back,detected=false; if(rects.length>=2){rects.sort((a,b)=>a.y-b.y||a.x-b.x);front=cropFromRect(c,rects[0]);back=cropFromRect(c,rects[1]);detected=true}else if(rects.length===1){front=cropFromRect(c,rects[0]);const fb=fallback(c,selected);back=fb[1];detected=true}else{[front,back]=fallback(c,selected)}
    slots[i].pdf=pdf;slots[i].render=c;slots[i].front=front;slots[i].back=back;slots[i].detected=detected;$('adjust-'+i).disabled=false;$('badge-'+i).textContent=detected?'AUTO':'FALLBACK';$('badge-'+i).style.background=detected?'#dcfce7':'#fef3c7';$('badge-'+i).style.color=detected?'#166534':'#92400e';setStatus(i,detected?`Auto detected ${selected==='auto'?'document':' '+selected} card area`:'Could not confidently detect cards — fallback applied','ok');$('bar').style.width='80%';draw();$('bar').style.width='100%';setTimeout(()=>$('bar').style.width='0',500);
  }catch(e){console.error(e);setStatus(i,e.name==='PasswordException'?'Wrong PDF password':'Could not read this PDF','bad');$('badge-'+i).textContent='ERROR';$('bar').style.width='0'}
}
function applyNudge(c,amount){if(!c)return c; if(!amount)return c; const out=document.createElement('canvas');out.width=CARDW;out.height=CARDH;const g=out.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,CARDW,CARDH);g.drawImage(c,amount/100*CARDW,0,CARDW,CARDH);return out}
function draw(){ctx.clearRect(0,0,A4W,A4H);ctx.fillStyle='#fff';ctx.fillRect(0,0,A4W,A4H);const n=+$('count').value,gap=Math.round(+$('gap').value/25.4*DPI);const x=(A4W-(CARDW*2+gap))/2; for(let i=1;i<=n;i++){const y=90+(i-1)*(CARDH+gap);if(y+CARDH>A4H-20)break;let s=slots[i];let f=applyNudge(s?.front,+$('adjust-'+i)?.value||0),b=applyNudge(s?.back,+$('adjust-'+i)?.value||0); if($('mirror').checked)[f,b]=[mirror(f),mirror(b)]; if(f)ctx.drawImage(f,x,y,CARDW,CARDH);else guide(x,y);if(b)ctx.drawImage(b,x+CARDW+gap,y,CARDW,CARDH);else guide(x+CARDW+gap,y)} if($('outline').checked){ctx.strokeStyle='#b6bec8';ctx.lineWidth=2;ctx.setLineDash([9,9]);for(let i=1;i<=n;i++){let y=90+(i-1)*(CARDH+gap);ctx.strokeRect(x,y,CARDW,CARDH);ctx.strokeRect(x+CARDW+gap,y,CARDW,CARDH)}ctx.setLineDash([])}}
function guide(x,y){ctx.save();ctx.strokeStyle='#cbd5e1';ctx.setLineDash([8,8]);ctx.strokeRect(x,y,CARDW,CARDH);ctx.restore()}
function mirror(src){if(!src)return src;const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(src,0,0);return c}
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(f)process(f,findEmpty())});$('drop').addEventListener('click',()=>$('file').click());$('drop').addEventListener('dragover',e=>{e.preventDefault();$('drop').classList.add('drag')});$('drop').addEventListener('dragleave',()=>$('drop').classList.remove('drag'));$('drop').addEventListener('drop',e=>{e.preventDefault();$('drop').classList.remove('drag');const f=e.dataTransfer.files[0];if(f?.type==='application/pdf')process(f,findEmpty())});
function findEmpty(){for(let i=1;i<=5;i++)if(!slots[i].pdf)return i;return 1}
for(let i=1;i<=5;i++){ $('type-'+i).addEventListener('change',()=>{if(slots[i].render) reclassify(i)});$('adjust-'+i).addEventListener('input',draw)}
function reclassify(i){const s=slots[i]; if(!s.render)return; const rects=detectCards(s.render); const kind=$('type-'+i).value; let pair;if(rects.length>=2){rects.sort((a,b)=>a.y-b.y||a.x-b.x);pair=[cropFromRect(s.render,rects[0]),cropFromRect(s.render,rects[1])];s.detected=true}else{pair=fallback(s.render,kind);s.detected=false}s.front=pair[0];s.back=pair[1];$('badge-'+i).textContent=s.detected?'AUTO':'FALLBACK';setStatus(i,s.detected?'Automatic card detection applied':'Fallback layout applied','ok');draw()}
['count','gap','mirror','outline'].forEach(id=>$(id).addEventListener('input',draw));
$('download').addEventListener('click',()=>{const a=document.createElement('a');a.download='PVC_A4_Print_Ready.jpg';a.href=$('a4').toDataURL('image/jpeg',1);a.click()});$('zoomIn').onclick=()=>{$('a4').style.width=(parseFloat(getComputedStyle($('a4')).width)+70)+'px'};$('zoomOut').onclick=()=>{$('a4').style.width=Math.max(350,parseFloat(getComputedStyle($('a4')).width)-70)+'px'};$('fit').onclick=()=>{$('a4').style.width='min(100%,900px)'};
draw();
</script></body></html>
