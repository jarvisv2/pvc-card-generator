<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrading Our Experience</title>
    <!-- Importing modern, clean font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B5CF6;
            --accent: #EC4899;
            --dark-gradient: linear-gradient(135deg, #1e0b36 0%, #0f051d 100%);
            --light-glass: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 20% 30%, #431407 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, #1e1b4b 0%, transparent 50%),
                        var(--dark-gradient);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Abstract colorful background blobs for depth */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.5;
        }
        .blob-1 { top: 15%; left: 10%; width: 300px; height: 300px; background: #6366f1; }
        .blob-2 { bottom: 10%; right: 5%; width: 400px; height: 400px; background: #db2777; }
        .blob-3 { top: 40%; right: 20%; width: 250px; height: 250px; background: #7c3aed; }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 540px;
            background: var(--light-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        }

        /* Responsive scaling */
        @media (min-width: 480px) {
            .container { padding: 50px 45px; }
        }

        /* Vibrant animated custom illustration area */
        .illustration-box {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Glowing background behind illustration */
        .glow {
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, rgba(236, 72, 153, 0.4) 100%);
            filter: blur(30px);
            z-index: -1;
        }

        /* Modern interactive SVG graphic depicting servers, gears and upgrades */
        .illustration-svg {
            width: 180px;
            height: auto;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .heading-badge {
            display: inline-block;
            background: linear-gradient(90deg, #3b82f633, #8b5cf633);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #a78bfa;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #f3e8ff, #fbcfe8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 15px;
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* Pulse status badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 35px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px #34d399;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        /* Dynamic Progress / Footer Section */
        .status-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        @media (min-width: 480px) {
            .status-footer {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .progress-box {
            flex: 1;
        }

        .progress-label {
            font-size: 12px;
            color: #9ca3af;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            width: 75%; /* Set status */
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            position: relative;
        }

        /* Subscribe option */
        .subscribe-form {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        @media (min-width: 480px) {
            .subscribe-form { max-width: 250px; }
        }

        .subscribe-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            flex-grow: 1;
            transition: all 0.3s ease;
        }

        .subscribe-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3);
        }

        .subscribe-button {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .subscribe-button:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .subscribe-button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="container">
        
        <!-- Illustration -->
        <div class="illustration-box">
            <div class="glow"></div>
            <!-- Interactive Modern Maintenance/Build SVG Graphic -->
            <svg class="illustration-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer gears & sparkles -->
                <circle cx="100" cy="100" r="80" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>
                <path d="M165 50L175 40M175 40L170 40M175 40L175 45" stroke="#EC4899" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                <path d="M30 160L20 170M20 170L25 170M20 170L20 165" stroke="#8B5CF6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                
                <!-- Main playful gear system -->
                <g transform="translate(60, 55)">
                    <circle cx="40" cy="40" r="28" fill="#8B5CF6" opacity="0.8"/>
                    <!-- gear tooth details -->
                    <rect x="36" y="4" width="8" height="12" rx="3" fill="#8B5CF6"/>
                    <rect x="36" y="64" width="8" height="12" rx="3" fill="#8B5CF6"/>
                    <rect x="4" y="36" width="12" height="8" rx="3" fill="#8B5CF6"/>
                    <rect x="64" y="36" width="12" height="8" rx="3" fill="#8B5CF6"/>
                    <circle cx="40" cy="40" r="14" fill="#1e0b36"/>
                </g>
                <g transform="translate(105, 105)">
                    <circle cx="20" cy="20" r="15" fill="#EC4899" opacity="0.8"/>
                    <rect x="17" y="1" width="6" height="7" rx="2" fill="#EC4899"/>
                    <rect x="17" y="32" width="6" height="7" rx="2" fill="#EC4899"/>
                    <circle cx="20" cy="20" r="7" fill="#1e0b36"/>
                </g>
                
                <!-- Server box being "upgraded" -->
                <rect x="55" y="100" width="60" height="45" rx="8" fill="url(#serverGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
                <circle cx="67" cy="112" r="3" fill="#10B981"/>
                <circle cx="67" cy="122" r="3" fill="#3B82F6"/>
                <circle cx="67" cy="132" r="3" fill="#EF4444"/>
                <line x1="77" y1="112" x2="103" y2="112" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
                <line x1="77" y1="122" x2="95" y2="122" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
                <line x1="77" y1="132" x2="105" y2="132" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>

                <!-- Giant animated wrench -->
                <g transform="translate(110, 65) rotate(-15)">
                    <rect x="10" y="2" width="8" height="35" rx="3" fill="#3B82F6"/>
                    <circle cx="14" cy="5" r="7" fill="#3B82F6"/>
                    <circle cx="14" cy="5" r="3" fill="#1e0b36"/>
                    <path d="M7 32 L21 32 L21 36 L7 36 Z" fill="#2563EB"/>
                </g>
                
                <!-- Definition of visual gradients -->
                <defs>
                    <linearGradient id="serverGrad" x1="55" y1="100" x2="115" y2="145" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#1F2937"/>
                        <stop offset="1" stop-color="#111827"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="heading-badge">UPGRADING OUR EXPERIENCE</div>
        <h1>We're building something amazing!</h1>
        <p>We are busy tinkering behind the scenes to bring you a fresh, fast, and feature-rich upgrade. Hang tight, we'll be back online very soon!</p>
        
        <div class="status-badge">
            <span class="dot"></span> Active Upgrades In Progress
        </div>

        <!-- Footer containing Progress tracker & newsletter sign-up -->
        <div class="status-footer">
            
            <div class="progress-box">
                <div class="progress-label">
                    <span>Estimated Completion</span>
                    <span>75% Done</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <div class="subscribe-form-box">
                <div class="progress-label" style="margin-bottom:6px;">Get Notified On Launch</div>
                <form class="subscribe-form" onsubmit="event.preventDefault(); alert('We will notify you when we launch!');">
                    <input type="email" placeholder="Enter your email" class="subscribe-input" required>
                    <button type="submit" class="subscribe-button">Notify Me</button>
                </form>
            </div>

        </div>

    </div>

</body>
</html>
